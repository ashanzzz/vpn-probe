# vpn-probe 配置文件示例模板 (config.example.yaml)
# 复制为 config.yaml 并填入真实配置。注意：config.yaml 已被 .gitignore 忽略，切勿提交入库！

server:
  host: "0.0.0.0"
  port: 8080
  auth_token: "YOUR_WRITE_OR_DEFAULT_TOKEN"    # 默认写/操作权限 Token (也可用环境变量 VPN_PROBE_AUTH_TOKEN)
  read_token: "YOUR_READONLY_TOKEN"            # 只读订阅拉取 Token (也可用环境变量 VPN_PROBE_READ_TOKEN)
  admin_token: "YOUR_ADMIN_MASTER_TOKEN"       # 管理员最高权限 Token (也可用环境变量 VPN_PROBE_ADMIN_TOKEN)

logging:
  level: "info"
  file_path: "./data/vpn-probe.log"

monitor:
  enabled: true
  health_check_interval: "2m"
  gfw_check_interval: "15m"
  split_check_interval: "30m"
  auto_sync_substore: true

  nodes:
    - name: "美西 ACCK 洛杉矶 4837 — VLESS Reality"
      url: "vless://00000000-0000-0000-0000-000000000000@1.2.3.4:36563?encryption=none&security=reality&sni=aws.amazon.com&fp=chrome&type=tcp&pbk=example_key&sid=example_sid#US-LAX-4837"
      is_self: true

    - name: "东京软银 — Shadowsocks 2022"
      url: "ss://2022-blake3-aes-128-gcm:ZXhhbXBsZQ==@1.2.3.4:24443#JP-Tokyo-Softbank-SS2022"
      is_self: true

substore:
  enabled: true
  url: "https://substore.example.com/api"
  username: "substore_user"
  password: "YOUR_SUBSTORE_PASSWORD"
  token: ""
  group_self_online: "在线自有服务"
  group_self_offline: "离线自有服务"
  group_self_online_china: "在线自有服务送中"
  group_self_online_clean: "在线自有服务不送中"
  group_ext_online_clean: "不送中"
  group_ext_online_china: "送中"

probe:
  singbox_bin: "sing-box"
  port_start: 30000
  port_end: 40000
  default_timeout: 8
  max_concurrency: 10
  google_ncr_url: "https://www.google.com/ncr"
  cloudflare_trace: "https://cloudflare.com/cdn-cgi/trace"
  latency_check_url: "https://www.gstatic.com/generate_204"
  abroad_probe:
    mode: "auto"
    fallback_to_public: true
    peer_concurrency: 2
    peer_timeout_ms: 3000
